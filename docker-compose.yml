services:
  wikilogger:
    build: .
    image: wikilogger:latest
    container_name: wikilogger
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/wikilogger.db
      - LOCAL_CACHE_DIR=/app/cache
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
